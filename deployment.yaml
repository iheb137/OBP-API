apiVersion: apps/v1
kind: Deployment
metadata:
  name: obp-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obp-api
  template:
    metadata:
      labels:
        app: obp-api
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo "waiting for postgres..."; sleep 2; done;']
      containers:
      - name: obp-api
        image: iheb99/obp-api:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: obp-api-config
        env:
        - name: CATALINA_OPTS
          value: >-
            -Ddb.driver=org.postgresql.Driver
            -Ddb.url=jdbc:postgresql://postgres-service:5432/postgres?sslmode=disable
            -Ddb.user=postgres
            -Ddb.password=$(DB_PASSWORD)
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
---
apiVersion: v1
kind: Service
metadata:
  name: obp-api-service
spec:
  selector:
    app: obp-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: NodePort
