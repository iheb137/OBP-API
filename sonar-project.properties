# Configuration SonarQube pour OBP-API

# Informations du projet
sonar.projectKey=biat-it-obp-api
sonar.projectName=BIAT IT - Open Bank Project API
sonar.projectVersion=1.0

# Chemin vers les sources
sonar.sources=obp-api/src/main,obp-commons/src/main
sonar.tests=obp-api/src/test,obp-commons/src/test

# Encodage du code source
sonar.sourceEncoding=UTF-8

# Langage
sonar.language=scala,java

# Exclusions
sonar.exclusions=**/*.js,**/*.css,**/*.html,**/*.xml,**/*.properties,**/*.sql

# Couverture de code
sonar.coverage.jacoco.xmlReportPaths=obp-api/target/site/jacoco/jacoco.xml,obp-commons/target/site/jacoco/jacoco.xml

# Rapports de tests unitaires
sonar.junit.reportPaths=obp-api/target/surefire-reports,obp-commons/target/surefire-reports

# Règles personnalisées
sonar.scala.scapegoat.reportPaths=obp-api/target/scala-2.12/scapegoat-report/scapegoat.xml