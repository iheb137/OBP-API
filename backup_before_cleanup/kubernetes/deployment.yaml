apiVersion: apps/v1
kind: Deployment
metadata:
  name: obp-api
  namespace: biat-banking
  labels:
    app: obp-api
    environment: ${ENVIRONMENT}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: obp-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: obp-api
        environment: ${ENVIRONMENT}
    spec:
      containers:
      - name: obp-api
        image: biat-it/obp-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /obp/v5.0.0/root
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /obp/v5.0.0/root
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 20
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        env:
        - name: JAVA_OPTS
          value: "-Xms1g -Xmx1g -XX:+UseG1GC"
        # Configuration depuis ConfigMap
        - name: OBP_HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: obp-api-config
              key: hostname
        - name: OBP_CONNECTOR
          valueFrom:
            configMapKeyRef:
              name: obp-api-config
              key: connector
        - name: OBP_STARCONNECTOR_SUPPORTED_TYPES
          valueFrom:
            configMapKeyRef:
              name: obp-api-config
              key: starConnector_supported_types
        # Secrets
        - name: OBP_DB_URL
          valueFrom:
            secretKeyRef:
              name: obp-api-secrets
              key: db_url
        - name: OBP_DB_USER
          valueFrom:
            secretKeyRef:
              name: obp-api-secrets
              key: db_user
        - name: OBP_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: obp-api-secrets
              key: db_password
        - name: OBP_IMPORTER_SECRET
          valueFrom:
            secretKeyRef:
              name: obp-api-secrets
              key: importer_secret
        - name: OBP_SANDBOX_DATA_IMPORT_SECRET
          valueFrom:
            secretKeyRef:
              name: obp-api-secrets
              key: sandbox_data_import_secret
        - name: OBP_REMOTEDATA_SECRET
          valueFrom:
            secretKeyRef:
              name: obp-api-secrets
              key: remotedata_secret
      imagePullSecrets:
      - name: biat-registry-credentials